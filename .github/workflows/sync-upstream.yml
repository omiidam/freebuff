name: Sync Freebuff upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout my branch
        uses: actions/checkout@v4
        with:
          ref: fix/currency-final
          fetch-depth: 0

      - name: Add upstream Freebuff
        run: |
          git remote add upstream https://github.com/CodebuffAI/freebuff.git
          git fetch upstream main

      - name: Merge upstream changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge upstream/main --no-edit

      - name: Push updated branch
        run: |
          git push origin fix/currency-final
